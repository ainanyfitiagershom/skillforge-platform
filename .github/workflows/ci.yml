name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # Build et tests du backend applicatif
  backend-app:
    name: Backend applicatif (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-app
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation
        run: mvn -B compile -DskipTests

      - name: Tests unitaires
        run: mvn -B test
        continue-on-error: true

  # Build du backend sandbox
  backend-sandbox:
    name: Backend sandbox (Docker runner)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-sandbox
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation
        run: mvn -B compile -DskipTests

      - name: Tests unitaires
        run: mvn -B test
        continue-on-error: true

  # Build du frontend web
  frontend-web:
    name: Frontend web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-web
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Installation Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: apps/frontend-web/pnpm-lock.yaml

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
