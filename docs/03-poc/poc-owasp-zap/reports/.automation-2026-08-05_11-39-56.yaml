env:
  contexts:
    - name: "skillforge-api"
      urls:
        - "http://host.docker.internal:8090"
      includePaths:
        - "http://host.docker.internal:8090.*"
      excludePaths:
        - "http://host.docker.internal:8090/actuator/.*"
        - "http://host.docker.internal:8090/v3/api-docs.*"
        - "http://host.docker.internal:8090/swagger-ui.*"
  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true

jobs:
  # 1. Charger le header Authorization Bearer pour toutes les requetes.
  #    matchType=req_header : ajoute/remplace le header (idempotent).
  #    Note : ZAP baseline attend une seule regle unique par header.
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: "Inject JWT recruteur"
        url: ""
        matchType: "req_header"
        matchString: "Authorization"
        matchRegex: false
        replacementString: "Bearer eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiI1MjgxN2I2ZC00MDIzLTQ3YzQtYjZjYy0yZTczOTYzYzE1NzIiLCJlbWFpbCI6InphcC1hdWRpdEBza2lsbGZvcmdlLmxvY2FsIiwicm9sZSI6IlJFQ1JVVEVVUiIsInR5cGUiOiJhY2Nlc3MiLCJpYXQiOjE3ODU5Mjk5OTYsImV4cCI6MTc4NTkzMTc5Nn0.c2XjwKDslZcuQ--5ZqWBKKqwNdKKhMapxq6lFc_OGKHYl_Ge9ThEWXwPJLdrY4bZmRg_EzrQnkRLlm7Ogyn5lQ"
        tokenProcessing: false
        initiators: []

  # 2. Importer la spec OpenAPI : ZAP decouvre les 30 endpoints
  - type: openapi
    parameters:
      apiFile: "/zap/wrk/.openapi-2026-08-05_11-39-56.json"
      targetUrl: "http://host.docker.internal:8090"
      context: "skillforge-api"

  # 3. Requestor : visiter tous les endpoints connus (imports OpenAPI) pour
  #    generer du trafic HTTP que le passive scan analysera. Sans cela, ZAP
  #    connait 33 URLs mais ne les a jamais requetees, aucun header a analyser.
  - type: requestor
    parameters:
      user: ""
    requests:
      - url: "http://host.docker.internal:8090/actuator/health"
        method: GET
      - url: "http://host.docker.internal:8090/actuator/info"
        method: GET
      - url: "http://host.docker.internal:8090/v3/api-docs"
        method: GET
      - url: "http://host.docker.internal:8090/questions"
        method: GET
      - url: "http://host.docker.internal:8090/tests"
        method: POST
      - url: "http://host.docker.internal:8090/analytics/kpis"
        method: GET
      - url: "http://host.docker.internal:8090/analytics/scores-distribution"
        method: GET
      - url: "http://host.docker.internal:8090/analytics/questions-stats"
        method: GET
      - url: "http://host.docker.internal:8090/analytics/skills-avg"
        method: GET
      - url: "http://host.docker.internal:8090/analytics/recent-candidates"
        method: GET
      - url: "http://host.docker.internal:8090/analytics/export/candidates.csv"
        method: GET
      - url: "http://host.docker.internal:8090/analytics/export/questions-stats.csv"
        method: GET
      - url: "http://host.docker.internal:8090/auth/login"
        method: POST
        data: '{"email":"test@t.io","password":"WrongPassword123!"}'
      - url: "http://host.docker.internal:8090/candidate/passations/00000000-0000-0000-0000-000000000000/state"
        method: GET
      - url: "http://host.docker.internal:8090/rgpd/purge-expired-cvs"
        method: POST
      - url: "http://host.docker.internal:8090/nonexistent-endpoint"
        method: GET

  # 4. Spider passif : complement sur les liens statiques
  - type: spider
    parameters:
      context: "skillforge-api"
      maxDuration: 3
      maxDepth: 3

  # 5. Attendre que les scans passifs aient fini de tourner sur toutes les URLs
  #    (le baseline scan repose sur les rules passives : CSP manquant, headers HTTP, cookies, ...)
  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  # 4a. Active scan (SQLi, XSS, path traversal, command injection, ...)
  - type: activeScan
    parameters:
      context: "skillforge-api"
      maxRuleDurationInMins: 3
      maxScanDurationInMins: 25
      policy: "Default Policy"

  # Reports
  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk"
      reportFile: "full-2026-08-05_11-39-56.html"
      reportTitle: "SkillForge - Audit OWASP ZAP - FULL - 2026-08-05_11-39-56"
  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk"
      reportFile: "full-2026-08-05_11-39-56.json"
  - type: report
    parameters:
      template: "traditional-md"
      reportDir: "/zap/wrk"
      reportFile: "full-2026-08-05_11-39-56.md"
