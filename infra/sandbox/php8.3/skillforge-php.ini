; Durcissement PHP pour sandbox SkillForge : bloque toutes les fonctions permettant
; d'atteindre le shell hote ou de compromettre l'isolation Docker.
; Applique via docker cp au build (voir Dockerfile).

; Fonctions systeme dangereuses : execution shell arbitraire
; Note : "eval" et "assert" ne sont pas listables ici (mots-cles langage / fonction interne PHPUnit).
; eval est neutralise par open_basedir + disable des fonctions dangereuses qu'il pourrait invoquer.
disable_functions = shell_exec,system,exec,passthru,proc_open,proc_close,proc_get_status,proc_nice,proc_terminate,popen,pcntl_exec,pcntl_fork,posix_kill,posix_mkfifo,posix_setuid,posix_setgid,dl,putenv,setenv

; Classes dangereuses
disable_classes = ReflectionFunction

; Ne pas afficher les infos sensibles dans les erreurs
expose_php = Off
display_errors = Off
log_errors = On

; Bloquer les wrappers reseau (renforce le network=none Docker)
allow_url_fopen = Off
allow_url_include = Off

; Bloquer include de fichiers systeme hors /work (mais laisser passer PHPUnit)
open_basedir = /work:/tmp:/usr/local/bin:/usr/local/lib:/usr/local/etc

; Limites eleves pour laisser passer les cas VALID normaux
memory_limit = 256M
max_execution_time = 5
