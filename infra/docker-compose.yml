# Services de développement local pour SkillForge.
# Lancer : docker compose -f infra/docker-compose.yml up -d
# Arrêter : docker compose -f infra/docker-compose.yml down
# Données persistées dans un volume nommé `skillforge_pgdata`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: skillforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillforge
      POSTGRES_USER: skillforge
      POSTGRES_PASSWORD: skillforge_dev
    # Mappé sur 5434 côté hôte (5432 et 5433 sont déjà occupés par d'autres projets).
    # Backend Spring Boot doit donc se connecter sur localhost:5434.
    ports:
      - "5434:5432"
    volumes:
      - skillforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillforge -d skillforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Faux serveur SMTP + interface web pour capturer les emails envoyes par le backend
  # (invitations candidats). Independant du mailpit Linkuma pour ne pas melanger les
  # projets. Ports mappes en 1026 (SMTP) et 8026 (UI) pour ne pas taper sur ceux qui
  # pourraient etre pris par d autres projets (Mailpit par defaut = 1025 / 8025).
  mailpit:
    image: axllent/mailpit:latest
    container_name: skillforge-mailpit
    restart: unless-stopped
    ports:
      - "1026:1025"   # SMTP (backend Spring -> Mailpit)
      - "8026:8025"   # UI web (http://localhost:8026)
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 3

  # LLM local pour la generation de tests, l analyse CV, la notation CAS et
  # les rapports IA. Alternative souveraine aux APIs externes (GitHub Models
  # retire fin 2026, Groq/OpenAI/Claude payants ou avec rate limits stricts).
  # Le modele est stocke dans un volume persistant : telecharge une seule
  # fois par machine (~4.5 Go pour qwen2.5:7b), reutilise a chaque restart.
  #
  # Pour telecharger le modele apres le premier `docker compose up -d` :
  #   docker exec -it skillforge-ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    container_name: skillforge-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"   # API HTTP (compatible OpenAI sur /v1/chat/completions)
    volumes:
      - skillforge_ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  skillforge_pgdata:
    name: skillforge_pgdata
  skillforge_ollama_models:
    name: skillforge_ollama_models
