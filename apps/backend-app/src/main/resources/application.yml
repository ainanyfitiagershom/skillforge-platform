spring:
  application:
    name: skillforge-backend-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/skillforge}
    username: ${DB_USER:skillforge}
    password: ${DB_PASSWORD:skillforge_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

  # SMTP pour l envoi des invitations candidat.
  # En dev : Mailpit SkillForge du docker-compose (skillforge-mailpit sur localhost:1026,
  #          UI web http://localhost:8026).
  # En prod : override via variables d env (Gmail SMTP, SendGrid, AWS SES, etc.).
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1026}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8090}  # 8080 deja pris par Traefik d'un autre projet

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

skillforge:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-secret-must-be-at-least-32-characters-long}
    access-ttl-minutes: 30
    refresh-ttl-days: 7
  llm:
    provider: ${LLM_PROVIDER:mock}  # mock | openai | github | claude | groq | ollama
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    github:
      token: ${GITHUB_TOKEN:}
      model: ${GITHUB_MODEL:openai/gpt-4o-mini}  # voir https://github.com/marketplace/models
      base-url: ${GITHUB_MODELS_BASE_URL:https://models.github.ai/inference}
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CLAUDE_MODEL:claude-sonnet-4-5}
    # Groq : API compatible OpenAI, free tier tres genereux (30 req/min).
    # Note (2026-11) : Llama 3.x a ete retire du free tier Groq.
    # Modele conseille : qwen/qwen3.8-27b (support natif json_object, ctx 131k).
    # Autres options : openai/gpt-oss-120b (plus gros mais json_validate parfois KO),
    # groq/compound (raisonnement, moins bon pour extraction JSON).
    # Cle a creer sur https://console.groq.com/keys
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:qwen/qwen3.8-27b}
    # Ollama : LLM 100% local, aucun cout, aucun quota, aucune dependance
    # reseau apres pull du modele. Conteneur skillforge-ollama demarre par
    # docker-compose. Model conseille : qwen2.5:7b (bon compromis qualite /
    # RAM 8 Go). Autres : llama3.2:3b (rapide), qwen2.5-coder:7b (code).
    # Pull : docker exec skillforge-ollama ollama pull qwen2.5:7b
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
      model: ${OLLAMA_MODEL:qwen2.5:7b}
  rgpd:
    cv-retention-months: 12
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@skillforge.local}
    from-name: ${MAIL_FROM_NAME:SkillForge - Tsarajoro}
    # URL publique du frontend (utilisee pour construire le lien candidat dans l email).
    # En dev : http://localhost:5173. En prod : URL SkillForge Tsarajoro.
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  sandbox:
    # URL du service backend-sandbox (port 8091 par defaut)
    url: ${SANDBOX_URL:http://localhost:8091}
    # Cle interne partagee avec backend-sandbox
    internal-key: ${SANDBOX_INTERNAL_KEY:dev-internal-key-please-change}

logging:
  level:
    root: INFO
    com.tsarajoro.skillforge: DEBUG
